name: Preview installable ZIPs

on:
  pull_request:
    paths:
      - 'game/**'
      - 'scripts/build_release.py'
      - '.github/workflows/preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify core and UI tests
        run: python -m unittest discover -s tests -q
      - name: Build both engine ZIPs
        run: python scripts/build_release.py v0.5.0 --output-dir dist
      - name: Upload preview artifacts (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: renpy-inspector-pr-${{ github.event.pull_request.number }}-preview
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
