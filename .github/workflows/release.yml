name: Release drop-in mod

# A merge to main creates a push event. Direct pushes to main also publish.
on:
  push:
    branches: [main]

permissions:
  contents: write

# Publish merges in order; never cancel a release that may be uploading assets.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify unit tests and release packaging
        run: python -m unittest discover -s tests -v

      - name: Build installable ZIP and checksum
        env:
          RELEASE_TAG: v0.1.${{ github.run_number }}
        run: python scripts/build_release.py "$RELEASE_TAG"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.1.${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/renpy-inspector-${RELEASE_TAG}.zip"
          checksum="${archive}.sha256"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A retry should repair incomplete asset uploads, not create a second tag.
            gh release upload "$RELEASE_TAG" "$archive" "$checksum" --clobber
          else
            gh release create "$RELEASE_TAG" "$archive" "$checksum" \
              --target "$GITHUB_SHA" \
              --title "Ren'Py Inspector $RELEASE_TAG" \
              --prerelease \
              --generate-notes
          fi
