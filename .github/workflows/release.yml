name: Release dual-engine drop-in mods

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    # A prerelease is published only after both interpreters and all four SDK
    # lint checks succeed on the exact merge commit being packaged.
    uses: ./.github/workflows/test.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build local Ant Design browser assets
        run: |
          cd web
          npm install --no-audit --no-fund
          npm test
          npm run build
          mkdir -p ../game/renpy_inspector_web
          cp -R dist/. ../game/renpy_inspector_web/

      - name: Choose next v0.6.x tag (stable across retries)
        id: release_tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing="$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
            --jq '.[] | select(.target_commitish == env.GITHUB_SHA) | select(.tag_name | test("^v0[.]6[.][0-9]+$")) | .tag_name' | head -n 1)"
          if [[ -n "$existing" ]]; then
            tag="$existing"
          else
            max_patch=-1
            git fetch --tags --force
            for candidate in $(git tag --list 'v0.6.*'); do
              if [[ "$candidate" =~ ^v0\.6\.([0-9]+)$ ]]; then
                patch="${BASH_REMATCH[1]}"
                if (( 10#$patch > max_patch )); then
                  max_patch=$((10#$patch))
                fi
              fi
            done
            tag="v0.6.$((max_patch + 1))"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build both engine ZIPs and checksum files
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          python scripts/build_release.py "$RELEASE_TAG" --engine both --require-web
          cd dist
          sha256sum -c *.sha256

      - name: Publish two packages in one prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "dist/renpy-inspector-${RELEASE_TAG}-renpy7.zip"
            "dist/renpy-inspector-${RELEASE_TAG}-renpy7.zip.sha256"
            "dist/renpy-inspector-${RELEASE_TAG}-renpy8.zip"
            "dist/renpy-inspector-${RELEASE_TAG}-renpy8.zip.sha256"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Ren'Py Inspector $RELEASE_TAG (Ren'Py 7 & 8)" \
              --prerelease \
              --generate-notes
          fi
