name: Dual-engine compatibility
on:
  pull_request:
  workflow_call:

jobs:
  python3-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests_py2 -v

  python2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python 2.7 compilation and compatibility tests
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work python:2.7.18-buster \
            sh -ec 'python -m compileall -q game/renpy_inspector && python -m unittest discover -s tests_py2 -v'

  renpy-sdk-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        renpy-version: ['7.4.11', '7.8.7', '8.4.1', '8.5.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assemble isolated Ren'Py project
        run: python scripts/prepare_fixture.py "$RUNNER_TEMP/inspector-fixture"
      - name: Download official Ren'Py SDK and lint fixture
        env:
          RENPY_VERSION: ${{ matrix.renpy-version }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fLSs --retry 3 --retry-delay 3 \
            -o renpy-sdk.tar.bz2 \
            "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.tar.bz2"
          tar -xjf renpy-sdk.tar.bz2
          sdk_script="$(find "$RUNNER_TEMP" -mindepth 2 -maxdepth 3 -name renpy.sh -type f -print -quit)"
          test -n "$sdk_script"
          bash "$sdk_script" "$RUNNER_TEMP/inspector-fixture" lint --error-code

  web-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies, test frontend and build Ant Design
        run: |
          npm install --prefix web --no-audit --no-fund
          npm run test --prefix web
          npm run build --prefix web
          test -f web/dist/index.html
      - name: Build downloadable dual-engine preview packages
        run: |
          mkdir -p game/renpy_inspector_web
          cp -a web/dist/. game/renpy_inspector_web/
          python scripts/build_release.py v0.6.0 --engine both --output-dir preview-dist
          cd preview-dist && sha256sum -c *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ant-design-preview-zips
          path: preview-dist/*
          retention-days: 7
