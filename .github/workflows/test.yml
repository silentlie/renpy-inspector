name: Dual-engine compatibility
on:
  pull_request:
  workflow_call:

jobs:
  python3-tests:
    # Ubuntu 26.04 runner images do not provide actions/setup-python 3.9.
    # Pin until the Python 3.9 compatibility target is retired.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests_py2 -v
      - name: Measure synthetic bridge root/page/favourite costs
        run: python scripts/benchmark_bridge.py --iterations 25 --output "${{ runner.temp }}/bridge-benchmark.json"
      - name: Keep inspectable synthetic timing report
        uses: actions/upload-artifact@v4
        with:
          name: bridge-benchmark-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/bridge-benchmark.json
          if-no-files-found: error

  python2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python 2.7 compilation and compatibility tests
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work python:2.7.18-buster \
            sh -ec 'python -m compileall -q game/renpy_inspector && python -m unittest discover -s tests_py2 -v'

  renpy-sdk-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        renpy-version: ['7.4.11', '7.8.7', '8.4.1', '8.5.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assemble isolated Ren'Py project
        run: python scripts/prepare_fixture.py "$RUNNER_TEMP/inspector-fixture"
      - name: Download official Ren'Py SDK and lint fixture
        env:
          RENPY_VERSION: ${{ matrix.renpy-version }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fLSs --retry 3 --retry-delay 3 \
            -o renpy-sdk.tar.bz2 \
            "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.tar.bz2"
          tar -xjf renpy-sdk.tar.bz2
          sdk_script="$(find "$RUNNER_TEMP" -mindepth 2 -maxdepth 3 -name renpy.sh -type f -print -quit)"
          test -n "$sdk_script"
          bash "$sdk_script" "$RUNNER_TEMP/inspector-fixture" lint --error-code

  ant-design-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install React and Ant Design dependencies
        run: npm install --no-audit --no-fund
      - name: Test tree utilities
        run: npm test
      - name: Compile browser UI
        run: npm run build
      - name: Check compiled HTML and assets
        run: test -f dist/index.html && test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
      - name: Share compiled UI with preview packaging
        uses: actions/upload-artifact@v4
        with:
          name: ant-design-dist
          path: web/dist/
          if-no-files-found: error

  browser-bridge-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Build the same production UI shipped to games
        run: npm run build
      - name: Install headless Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise browser and authenticated Python bridge end-to-end
        run: npm run test:e2e
      - name: Upload Playwright report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-bridge-e2e
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore

  preview-packages:
    if: github.event_name == 'pull_request'
    needs: [python3-tests, python2-tests, renpy-sdk-lint, ant-design-ui, browser-bridge-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unpack compiled Ant Design UI
        uses: actions/download-artifact@v4
        with:
          name: ant-design-dist
          path: game/renpy_inspector_web
      - name: Build both installable preview packages
        run: |
          python scripts/build_release.py v0.7.2 --engine both --require-web
          python scripts/verify_release.py \
            dist/renpy-inspector-v0.7.2-renpy7.zip \
            dist/renpy-inspector-v0.7.2-renpy8.zip
          cd dist
          sha256sum -c *.sha256
      - name: Upload experimental Ren'Py 7 and 8 ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: renpy-inspector-v0.7.2-preview
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
